<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<title>太空態勢儀表板 — 進階版 04-adv01（向量化 SGP4 + 近距離掃描 + 搜尋）</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/globe.css') }}"/>
<script>
(function(){
  function _css(h){var l=document.createElement('link');l.rel='stylesheet';l.href=h;document.head.appendChild(l);}
  function _js(src,ok,fail){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=fail||function(){};document.head.appendChild(s);}
  function _err(m){
    function _s(){var el=document.getElementById('warn');if(el){el.textContent=m;el.style.background='rgba(244,67,54,.88)';el.style.display='block';}}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_s);else _s();
  }
  _css('/cesium/Widgets/widgets.css');
  _js("{{ url_for('static', filename='js/globe.js') }}",function(){
    _js('/cesium/Cesium.js',function(){startApp();},function(){_err('本機 Cesium 未安裝，請將 CesiumJS 解壓至 data/cesium/');});
  },function(){_err('前端腳本 globe.js 載入失敗');});
}());
</script>
</head>
<body>

<div id="topbar">
  <h1>&#127760; <span data-i18n="app_title">太空態勢儀表板（進階版）</span></h1>
  <div class="tcards">
    <div class="tcard"><div class="val" id="c-total">—</div><div class="lbl" data-i18n="lbl_total">追蹤物件</div></div>
    <div class="tcard payload"><div class="val" id="c-payload">—</div><div class="lbl" data-i18n="lbl_payload">有效載荷</div></div>
    <div class="tcard debris"><div class="val" id="c-debris">—</div><div class="lbl" data-i18n="lbl_debris">碎片</div></div>
    <div class="tcard rocket"><div class="val" id="c-rocket">—</div><div class="lbl" data-i18n="lbl_rocket">火箭體</div></div>
    <div class="tcard"><div class="val" id="c-new">—</div><div class="lbl" data-i18n="lbl_new">近 1 年</div></div>
    <div class="tcard conj clickable" id="conj-card" onclick="toggleConjPanel()" data-i18n-title="tip_conj" title="點選查看近距離配對清單">
      <div class="val" id="c-conj">...</div>
      <div class="lbl" data-i18n="lbl_conj">近距離配對</div>
    </div>
  </div>
  <button id="track-btn" onclick="toggleTrackPanel()" data-i18n-title="tip_track" title="NORAD 監測（user_defined_tracking_NORAD 清單，可同時追蹤多顆衛星）">&#127919; <span data-i18n="btn_track">NORAD 監測</span><span id="track-count"></span></button>
  <button type="button" id="taipei-link" class="tbtn" onclick="window.open('/taipei','_blank')">&#127988; <span data-i18n="nav_taipei">台北覆蓋分析</span></button>
  <button type="button" id="starlink-link" class="tbtn" onclick="window.open('/starlink','_blank')">&#127921; <span data-i18n="nav_starlink">Starlink 分析</span></button>
  <button type="button" id="constel-link" class="tbtn" onclick="window.open('/constellations','_blank')">&#127756; <span data-i18n="nav_constel">星座排行</span></button>
  <button type="button" id="rpo-link" class="tbtn" onclick="window.open('/rpo','_blank')" data-i18n-title="tip_rpo" title="近距離配對相對接近 3D 場景 + Chan Pc（可切換兩顆衛星視角）">&#128752; <span data-i18n="nav_rpo">RPO功能測試</span></button>
  <button type="button" id="story-link" class="tbtn" onclick="window.open('/story','_blank')" data-i18n-title="tip_story" title="StoryMap 敘事頁：星系・機動・地基追蹤・碰撞預警整合展示">&#128214; <span data-i18n="nav_story">StoryMap</span></button>
  <div id="lang-switcher">
    <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
    <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
  </div>
  <div id="ts">—</div>
  <div id="utc-clock">
    <div class="led-time" id="led-time">--:--:--</div>
    <div class="led-label">UTC</div>
  </div>
</div>

<div id="db-info-bar">
  <span class="dbi-k" data-i18n="dbi_db">DB:</span>
  <span id="dbi-name" class="dbi-v">—</span>
  <span class="dbi-sep">|</span>
  <span class="dbi-k" data-i18n="dbi_update">更新：</span><span id="dbi-mtime" class="dbi-v">—</span>
  <span class="dbi-sep">|</span>
  <span class="dbi-k" data-i18n="dbi_valid">有效衛星：</span><span id="dbi-sats" class="dbi-v">—</span>
  <span class="dbi-sep">|</span>
  <span class="dbi-k" data-i18n="dbi_epoch">TLE 日期：</span><span id="dbi-epoch" class="dbi-v">—</span>
  <span class="dbi-sep">|</span>
  <span class="dbi-k" data-i18n="dbi_size">大小：</span><span id="dbi-size" class="dbi-v">—</span>
</div>

<div id="main">
  <div id="panel">
    <div id="search-box">
      <input id="search-input" type="text" data-i18n-placeholder="search_placeholder" placeholder="搜尋 NORAD ID 或衛星名稱..." autocomplete="off"/>
      <button id="search-clear" onclick="clearSearch()">×</button>
    </div>
    <div id="tabs">
      <button class="tab active" data-tab="country"       onclick="switchTab('country')" data-i18n="tab_country">國家</button>
      <button class="tab"        data-tab="purpose"       onclick="switchTab('purpose')" data-i18n="tab_purpose">用途</button>
      <button class="tab"        data-tab="era"           onclick="switchTab('era')" data-i18n="tab_era">年代</button>
      <button class="tab"        data-tab="constellation" onclick="switchTab('constellation')" data-i18n="tab_constellation">星座</button>
    </div>
    <div id="panel-back">
      <button onclick="backToTabs()">&#8592; <span data-i18n="btn_back">返回</span></button>
    </div>
    <div id="panel-body"></div>
    <div id="filter-status">點選左側分類以在地圖上顯示（全量，無抽樣）</div>
    <div id="sat-detail-panel" style="display:none"></div>
    <div id="basemap-bar">
      <div class="sec collapsible" onclick="toggleSec(this)"><span data-i18n="sec_basemap">底圖</span><span class="sec-arrow">&#9654;</span></div>
      <div class="sec-body">
        <div id="basemap-btns"></div>
      </div>
    </div>
    <div id="layer-bar">
      <div class="sec collapsible" onclick="toggleSec(this)"><span data-i18n="sec_layers">向量圖層</span><span class="sec-arrow">&#9654;</span></div>
      <div class="sec-body">
        <label>
          <input type="checkbox" id="chk-borders" checked onchange="toggleLayer('borders',this)"/>
          <span style="width:9px;height:9px;border-radius:50%;background:#FFD600;display:inline-block;flex-shrink:0"></span>
          <span data-i18n="chk_borders">全球國界</span>
        </label>
        <label>
          <input type="checkbox" id="chk-ssn" onchange="toggleLayer('ssn',this)"/>
          <span style="width:9px;height:9px;border-radius:50%;background:#00E5FF;display:inline-block;flex-shrink:0"></span>
          <span data-i18n="chk_ssn">SSN 地面觀測站</span>
        </label>
      </div>
    </div>
  </div>

  <div id="cesiumContainer">
    <div id="warn"></div>
    <div id="loading" data-i18n="loading_text">正在初始化地球...</div>
    <div id="logo-overlay"><img src="/api/logo" alt="ATRDC" onerror="this.parentElement.style.display='none'"/></div>
  </div>
</div>

<script>
function toggleSec(el){
  var b=el.nextElementSibling;
  var open=b.classList.toggle('open');
  el.querySelector('.sec-arrow').style.transform=open?'rotate(90deg)':'rotate(0deg)';
}
</script>
</body>
</html>
