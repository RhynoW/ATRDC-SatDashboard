<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starlink 顆數普查 — SatDashboard</title>
<style>
:root{--bg:#0A0D13;--panel:#12161f;--line:rgba(255,255,255,.09);--ink:#dfe6f0;--muted:#8b96a8;
      --prim:#F2A73B;--sec:#35C6F4;--good:#3fb950;--crit:#FF5C4E;--mono:"Consolas","Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 "Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0}
.top a{color:var(--sec);text-decoration:none;font-family:var(--mono);font-size:12px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.card h2{font-size:16px;margin:0 0 10px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat .n{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat .l{color:var(--muted);font-size:11.5px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase}
td.num{font-family:var(--mono);text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-family:var(--mono)}
.badge.match{background:rgba(63,185,80,.15);color:var(--good)}
.badge.gap{background:rgba(255,92,78,.15);color:var(--crit)}
.note{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:10px;line-height:1.7}
.err{color:var(--crit);font-size:12.5px}
#lang-switcher{display:inline-flex;gap:4px;margin-left:auto}
.lang-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.lang-btn.active{background:var(--sec);color:#03202b;border-color:var(--sec)}
.loading{color:var(--muted);font-size:13px;padding:20px 0}
a.btn{display:inline-block;background:var(--prim);color:#1a1205;border-radius:8px;padding:8px 14px;
     font-family:var(--mono);font-size:12.5px;font-weight:700;text-decoration:none;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🛰 <span data-i18n="page_title">Starlink 顆數普查</span></h1>
    <a href="/" data-i18n="nav_home">← 地球儀主頁</a>
    <a href="/starlink-deorbit" data-i18n="nav_deorbit">正在離軌的 Starlink →</a>
    <span id="lang-switcher">
      <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
    </span>
  </div>
  <p class="sub" data-i18n="page_sub">即時比對 keeptrack.space 公開的 Starlink 在軌顆數，與本系統依不同統計口徑算出的實際數字，說明差異的成因。</p>

  <div class="card">
    <h2 data-i18n="kt_title">keeptrack.space 公開數字</h2>
    <div id="kt-body" class="loading" data-i18n="loading">載入中…</div>
  </div>

  <div class="card">
    <h2 data-i18n="ours_title">本系統依不同口徑算出的數字</h2>
    <div id="ours-body" class="loading" data-i18n="loading">載入中…</div>
  </div>

  <div class="card">
    <h2 data-i18n="explain_title">為什麼數字會不一樣？</h2>
    <div id="explain-body"></div>
  </div>
</div>

<script>
"use strict";
const I18N = {
  zh: {
    page_title: "Starlink 顆數普查",
    nav_home: "← 地球儀主頁",
    nav_deorbit: "正在離軌的 Starlink →",
    page_sub: "即時比對 keeptrack.space 公開的 Starlink 在軌顆數，與本系統依不同統計口徑算出的實際數字，說明差異的成因。",
    loading: "載入中…",
    kt_title: "keeptrack.space 公開數字",
    ours_title: "本系統依不同口徑算出的數字",
    explain_title: "為什麼數字會不一樣？",
    kt_in_orbit: "在軌（In Orbit）", kt_working: "運作中（Working）", kt_launched: "累計發射（Launched）",
    kt_as_of: "資料時間：{d}", kt_source: "資料來源：keeptrack.space（自動抓取，快取 6 小時）",
    kt_error: "無法即時取得 keeptrack.space 資料：{err}（對方網站可能暫時無法連線或改版，之後可重新整理再試）",
    ours_cumulative: "累計曾出現過（不篩新鮮度）", ours_30d: "近 30 天有 TLE", ours_14d: "近 14 天有 TLE", ours_7d: "近 7 天有 TLE",
    ours_epoch: "本系統資料庫最新 TLE 時刻：{d}",
    th_metric: "統計方式", th_count: "顆數", th_vs_kt: "對照 keeptrack「在軌」",
    match: "接近", gap: "偏高",
    explain_p1: "keeptrack.space 的「在軌（In Orbit）」= 累計發射 − 已確認再入者，也就是「目前扣除掉已離軌的」。",
    explain_p2: "本系統若不做任何新鮮度篩選、單純數「資料庫裡曾經出現過名稱含 STARLINK 的相異 NORAD 數」，會偏高，因為這個口徑還留著一批「近一個月已無新 TLE、依最後已知高度判斷極可能已經再入大氣層」的舊衛星（本系統的其他統計功能亦沿用「不做新鮮度過濾」的既有口徑，見下方頁面）。",
    explain_p3: "一旦改用「近 30 天內仍有 TLE 更新」這個口徑，本系統的數字會非常接近 keeptrack 的「在軌」數字——殘餘的個位數/十位數差距，來自兩邊資料快照時間點不同、以及新鮮度門檻定義的些微差異，屬正常範圍。",
    explain_p4: "本系統的「正在離軌」清單使用即時查詢，可以看到那些「已無新 TLE、高度快速下降」的候選衛星名單："
  },
  en: {
    page_title: "Starlink Satellite Count Audit",
    nav_home: "← Globe Home",
    nav_deorbit: "Deorbiting Starlinks →",
    page_sub: "Live comparison of keeptrack.space's public Starlink in-orbit count against this system's own counts under different methodologies, explaining the gap.",
    loading: "Loading…",
    kt_title: "keeptrack.space Public Numbers",
    ours_title: "This System's Counts Under Different Methodologies",
    explain_title: "Why Do the Numbers Differ?",
    kt_in_orbit: "In Orbit", kt_working: "Working", kt_launched: "Launched (Total)",
    kt_as_of: "As of: {d}", kt_source: "Source: keeptrack.space (auto-fetched, cached 6 h)",
    kt_error: "Could not fetch live data from keeptrack.space: {err} (the site may be temporarily unreachable or redesigned; try refreshing later)",
    ours_cumulative: "Ever seen (no freshness filter)", ours_30d: "TLE within last 30 days", ours_14d: "TLE within last 14 days", ours_7d: "TLE within last 7 days",
    ours_epoch: "This system's latest TLE timestamp: {d}",
    th_metric: "Method", th_count: "Count", th_vs_kt: "vs. keeptrack \"In Orbit\"",
    match: "Close match", gap: "Overcounts",
    explain_p1: "keeptrack.space's \"In Orbit\" = total launched minus confirmed reentries — i.e., \"currently minus those already deorbited.\"",
    explain_p2: "If this system counts, with no freshness filter, every distinct NORAD ID whose name has ever contained STARLINK in the database, the result runs high because it still includes a batch of older satellites with no new TLE in roughly the last month, whose last-known altitude strongly suggests they have already reentered (other statistics elsewhere in this system also intentionally use this same \"no freshness filter\" convention — see the pages below).",
    explain_p3: "Once filtered to \"TLE updated within the last 30 days,\" this system's number comes very close to keeptrack's \"In Orbit\" figure — the small residual gap is normal, arising from the two sides taking their snapshots at slightly different moments and using slightly different freshness thresholds.",
    explain_p4: "This system's \"currently deorbiting\" list is a live query showing candidate satellites with no recent TLE and rapidly dropping altitude:"
  },
  ja: {
    page_title: "Starlink 機数調査",
    nav_home: "← 地球儀ホームへ",
    nav_deorbit: "離軌中のStarlink →",
    page_sub: "keeptrack.space が公開しているStarlinkの在軌機数と、本システムが異なる集計方法で算出した実際の数値をリアルタイムで比較し、差異の原因を説明します。",
    loading: "読み込み中…",
    kt_title: "keeptrack.space の公開数値",
    ours_title: "本システムによる異なる集計方法での数値",
    explain_title: "なぜ数値が異なるのか？",
    kt_in_orbit: "在軌（In Orbit）", kt_working: "稼働中（Working）", kt_launched: "累計打ち上げ数（Launched）",
    kt_as_of: "データ時点：{d}", kt_source: "データ出典：keeptrack.space（自動取得、6時間キャッシュ）",
    kt_error: "keeptrack.space からのリアルタイムデータ取得に失敗しました：{err}（相手サイトが一時的に接続不能か、構成変更の可能性があります。後ほど再読み込みしてください）",
    ours_cumulative: "累計で出現（鮮度フィルタなし）", ours_30d: "直近30日以内にTLEあり", ours_14d: "直近14日以内にTLEあり", ours_7d: "直近7日以内にTLEあり",
    ours_epoch: "本システムのデータベース最新TLE時刻：{d}",
    th_metric: "集計方法", th_count: "機数", th_vs_kt: "keeptrack「在軌」との比較",
    match: "近い", gap: "多め",
    explain_p1: "keeptrack.space の「在軌（In Orbit）」＝ 累計打ち上げ数 − 再突入確認済み機数、つまり「現在から既に離軌したものを除いた数」です。",
    explain_p2: "本システムが鮮度フィルタなしに、データベース内で名称にSTARLINKを含む相異なるNORAD IDを単純に数えると数値が多くなります。これは「直近1か月ほど新しいTLEがなく、最後に判明していた高度から見て再突入している可能性が高い」旧世代の衛星群がまだ含まれているためです（本システムの他の統計機能も同様に「鮮度フィルタなし」の既存の集計方針を踏襲しています。下記のページを参照）。",
    explain_p3: "「直近30日以内にTLE更新あり」という条件でフィルタすると、本システムの数値は keeptrack の「在軌」数値に非常に近くなります。残る若干の差は、両者のデータ取得タイミングの違いや鮮度しきい値の定義のわずかな違いによるもので、正常な範囲内です。",
    explain_p4: "本システムの「現在離軌中」リストはリアルタイムクエリで、新しいTLEがなく高度が急速に低下している候補衛星を表示します："
  },
};
let LANG = localStorage.getItem('starlink_census_lang') || 'zh';
if (!I18N[LANG]) LANG = 'zh';
function t(key, vars) {
  const d = I18N[LANG] || I18N.zh;
  let s = (key in d) ? d[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}
function fmtN(n) { return (n === null || n === undefined) ? '—' : n.toLocaleString(); }

let LAST_DATA = null;

function setLang(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  localStorage.setItem('starlink_census_lang', lang);
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en-US', ja: 'ja-JP' }[lang] || 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  if (LAST_DATA) render(LAST_DATA);
}

function render(data) {
  LAST_DATA = data;
  const kt = data.keeptrack || {};
  const ours = data.ours || {};

  const ktBody = document.getElementById('kt-body');
  if (kt.error) {
    ktBody.innerHTML = `<div class="err">${t('kt_error', { err: kt.error })}</div>`;
  } else {
    ktBody.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="n">${fmtN(kt.in_orbit)}</div><div class="l">${t('kt_in_orbit')}</div></div>
        <div class="stat"><div class="n">${fmtN(kt.working)}</div><div class="l">${t('kt_working')}</div></div>
        <div class="stat"><div class="n">${fmtN(kt.launched_total)}</div><div class="l">${t('kt_launched')}</div></div>
      </div>
      <div class="note">${kt.as_of ? t('kt_as_of', { d: kt.as_of }) + '　·　' : ''}${t('kt_source')}
        　·　<a href="${kt.source_url}" target="_blank" rel="noopener" style="color:var(--sec)">${kt.source_url}</a></div>`;
  }

  if (ours.error) {
    document.getElementById('ours-body').innerHTML = `<div class="err">${ours.error}</div>`;
  } else {
    const ktIn = kt.in_orbit;
    const rows = [
      ['ours_cumulative', ours.cumulative_all_time],
      ['ours_30d', ours.fresh_30d],
      ['ours_14d', ours.fresh_14d],
      ['ours_7d', ours.fresh_7d],
    ];
    let trs = rows.map(([k, v]) => {
      let badge = '';
      if (typeof ktIn === 'number' && typeof v === 'number') {
        const diff = Math.abs(v - ktIn);
        badge = diff <= 50
          ? `<span class="badge match">${t('match')} (Δ${diff})</span>`
          : `<span class="badge gap">${t('gap')} (+${v - ktIn})</span>`;
      }
      return `<tr><td>${t(k)}</td><td class="num">${fmtN(v)}</td><td>${badge}</td></tr>`;
    }).join('');
    document.getElementById('ours-body').innerHTML = `
      <table><thead><tr><th>${t('th_metric')}</th><th>${t('th_count')}</th><th>${t('th_vs_kt')}</th></tr></thead>
      <tbody>${trs}</tbody></table>
      <div class="note">${t('ours_epoch', { d: (ours.db_latest_epoch || '—').replace('T', ' ').slice(0, 19) })}</div>`;
  }

  document.getElementById('explain-body').innerHTML = `
    <p>${t('explain_p1')}</p>
    <p>${t('explain_p2')}</p>
    <p>${t('explain_p3')}</p>
    <p>${t('explain_p4')}</p>
    <a class="btn" href="/starlink-deorbit">${t('nav_deorbit')}</a>`;
}

async function load() {
  try {
    const res = await fetch('/api/starlink/census');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('kt-body').innerHTML = `<div class="err">${e}</div>`;
    document.getElementById('ours-body').innerHTML = '';
  }
}

setLang(LANG);
load();
</script>
</body>
</html>
