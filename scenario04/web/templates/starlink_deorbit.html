<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在離軌的 Starlink — SatDashboard</title>
<style>
:root{--bg:#0A0D13;--panel:#12161f;--line:rgba(255,255,255,.09);--ink:#dfe6f0;--muted:#8b96a8;
      --prim:#F2A73B;--sec:#35C6F4;--crit:#FF5C4E;--mono:"Consolas","Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 "Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0}
.top a{color:var(--sec);text-decoration:none;font-family:var(--mono);font-size:12px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
.meta{color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td.num{font-family:var(--mono);text-align:right}
td.neg{color:var(--crit)}
tr.detail-row td{background:rgba(255,255,255,.02);padding:12px 16px}
.btn-detail{background:transparent;border:1px solid var(--line);color:var(--sec);border-radius:6px;
  padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.btn-detail:hover{border-color:var(--sec)}
.loading{color:var(--muted);font-size:13px;padding:20px 0}
.err{color:var(--crit);font-size:12.5px}
.note{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:14px;line-height:1.7}
#lang-switcher{display:inline-flex;gap:4px;margin-left:auto}
.lang-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.lang-btn.active{background:var(--sec);color:#03202b;border-color:var(--sec)}
.refresh-btn{background:var(--prim);color:#1a1205;border:none;border-radius:6px;padding:5px 12px;
  font-family:var(--mono);font-size:11.5px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>⬇ <span data-i18n="page_title">正在離軌的 Starlink</span></h1>
    <a href="/" data-i18n="nav_home">← 地球儀主頁</a>
    <a href="/starlink-census" data-i18n="nav_census">Starlink 顆數普查 →</a>
    <span id="lang-switcher">
      <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
    </span>
  </div>
  <p class="sub" data-i18n="page_sub">即時查詢：近 5 天仍有 TLE、近 30 天半長軸下降逾 40 km、且高度低於 480 km 的 Starlink 衛星（離軌候選）。點「詳細」看單顆 SGP4 逐圈外推之零階再入估算。</p>
  <div class="meta" id="meta-line"><span data-i18n="loading">載入中…</span></div>
  <div id="table-wrap"></div>
  <div class="note" id="note-line"></div>
</div>

<script>
"use strict";
const I18N = {
  zh: {
    page_title: "正在離軌的 Starlink", nav_home: "← 地球儀主頁", nav_census: "Starlink 顆數普查 →",
    page_sub: "即時查詢：近 5 天仍有 TLE、近 30 天半長軸下降逾 40 km、且高度低於 480 km 的 Starlink 衛星（離軌候選）。點「詳細」看單顆 SGP4 逐圈外推之零階再入估算。",
    loading: "載入中…", refresh: "重新整理",
    meta_line: "符合條件共 {total} 顆，顯示前 {shown} 顆　·　更新時間 {t}",
    th_name: "衛星", th_norad: "NORAD", th_launch: "發射日", th_alt: "目前高度 (km)",
    th_da30: "30 天 Δ高度 (km)", th_da7: "7 天 Δ高度 (km)", th_est: "粗估剩餘天數", th_detail: "詳細",
    btn_detail: "詳細 ▾", btn_hide: "收合 ▴", est_unknown: "—",
    detail_loading: "計算中（SGP4 逐圈外推）…",
    detail_reentered: "預估再入圈次：{t}　·　次衛星點 {lat}°, {lon}°　·　高度 {alt} km",
    detail_not_found: "在 {days} 天外推範圍內未找到再入圈次（可能衰減較慢，或已超出模型可靠範圍）",
    detail_error: "計算失敗：{err}",
    detail_method: "方法：{m}",
    note_line: "「粗估剩餘天數」為近 7 天平均下降速率之線性外推，未計入阻力隨高度指數增強，對接近再入者會低估剩餘天數（實際更快）；資料：本系統 space_db（Space-Track GP）。",
  },
  en: {
    page_title: "Deorbiting Starlink Satellites", nav_home: "← Globe Home", nav_census: "Starlink Count Audit →",
    page_sub: "Live query: Starlink satellites with a TLE within the last 5 days, a semi-major-axis drop of more than 40 km over the last 30 days, and an altitude below 480 km (deorbit candidates). Click \"Detail\" for a single-satellite SGP4 orbit-by-orbit reentry estimate.",
    loading: "Loading…", refresh: "Refresh",
    meta_line: "{total} satellites match, showing top {shown}　·　updated {t}",
    th_name: "Satellite", th_norad: "NORAD", th_launch: "Launch Date", th_alt: "Current Altitude (km)",
    th_da30: "30-day ΔAltitude (km)", th_da7: "7-day ΔAltitude (km)", th_est: "Rough Days Remaining", th_detail: "Detail",
    btn_detail: "Detail ▾", btn_hide: "Hide ▴", est_unknown: "—",
    detail_loading: "Computing (SGP4 orbit-by-orbit propagation)…",
    detail_reentered: "Estimated reentry pass: {t}   ·   Subsatellite point {lat}°, {lon}°   ·   Altitude {alt} km",
    detail_not_found: "No reentry pass found within the {days}-day propagation window (decay may be slower, or beyond the model's reliable range)",
    detail_error: "Computation failed: {err}",
    detail_method: "Method: {m}",
    note_line: "\"Rough days remaining\" is a linear extrapolation of the average 7-day descent rate; it does not account for drag increasing exponentially at lower altitude, so it underestimates remaining time for satellites close to reentry (actual reentry will be sooner). Data: this system's space_db (Space-Track GP).",
  },
  ja: {
    page_title: "離軌中のStarlink衛星", nav_home: "← 地球儀ホームへ", nav_census: "Starlink機数調査 →",
    page_sub: "リアルタイムクエリ：直近5日以内にTLEがあり、直近30日間で軌道長半径が40km以上低下し、高度が480km未満のStarlink衛星（離軌候補）。「詳細」をクリックすると、SGP4による1機ずつの周回外挿による零次再突入推定を表示します。",
    loading: "読み込み中…", refresh: "再読み込み",
    meta_line: "該当 {total} 機、上位 {shown} 機を表示　·　更新時刻 {t}",
    th_name: "衛星", th_norad: "NORAD", th_launch: "打ち上げ日", th_alt: "現在高度 (km)",
    th_da30: "30日間 Δ高度 (km)", th_da7: "7日間 Δ高度 (km)", th_est: "残り日数（概算）", th_detail: "詳細",
    btn_detail: "詳細 ▾", btn_hide: "閉じる ▴", est_unknown: "—",
    detail_loading: "計算中（SGP4による周回外挿）…",
    detail_reentered: "推定再突入周回：{t}　·　直下点 {lat}°, {lon}°　·　高度 {alt} km",
    detail_not_found: "{days}日間の外挿範囲内では再突入周回が見つかりませんでした（減衰が緩やかか、モデルの信頼範囲を超えている可能性があります）",
    detail_error: "計算に失敗しました：{err}",
    detail_method: "方法：{m}",
    note_line: "「残り日数（概算）」は直近7日間の平均降下速度による線形外挿であり、高度低下に伴う大気抵抗の指数的増大を考慮していないため、再突入が近い衛星ほど残り時間を過小評価します（実際にはより早く再突入します）。データ：本システムの space_db（Space-Track GP）。",
  },
};
let LANG = localStorage.getItem('starlink_deorbit_lang') || 'zh';
if (!I18N[LANG]) LANG = 'zh';
function t(key, vars) {
  const d = I18N[LANG] || I18N.zh;
  let s = (key in d) ? d[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', String(vars[k])); });
  return s;
}

let LAST_DATA = null;
let SORT_KEY = 'alt_km', SORT_DIR = 1;

function setLang(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  localStorage.setItem('starlink_deorbit_lang', lang);
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en-US', ja: 'ja-JP' }[lang] || 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  if (LAST_DATA) renderTable(LAST_DATA);
}

function renderTable(data) {
  LAST_DATA = data;
  if (data.error) {
    document.getElementById('table-wrap').innerHTML = `<div class="err">${data.error}</div>`;
    return;
  }
  document.getElementById('meta-line').innerHTML =
    t('meta_line', { total: data.total_matching, shown: data.shown,
      t: (data.generated_at || '').replace('T', ' ').slice(0, 19) + ' UTC' });
  document.getElementById('note-line').textContent = t('note_line');

  const items = [...data.items].sort((a, b) => (a[SORT_KEY] - b[SORT_KEY]) * SORT_DIR);
  const cols = [
    ['name', 'th_name'], ['norad_id', 'th_norad'], ['launch_date', 'th_launch'],
    ['alt_km', 'th_alt'], ['da_30d_km', 'th_da30'], ['da_7d_km', 'th_da7'],
    ['est_days_to_reentry_rough', 'th_est'], [null, 'th_detail'],
  ];
  const head = cols.map(([k, label]) =>
    `<th ${k ? `onclick="sortBy('${k}')"` : ''}>${t(label)}${k === SORT_KEY ? (SORT_DIR > 0 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('');

  const rows = items.map(it => `
    <tr>
      <td>${it.name}</td>
      <td class="num">${it.norad_id}</td>
      <td>${it.launch_date || '—'}</td>
      <td class="num">${it.alt_km}</td>
      <td class="num neg">${it.da_30d_km}</td>
      <td class="num neg">${it.da_7d_km}</td>
      <td class="num">${it.est_days_to_reentry_rough ?? t('est_unknown')}</td>
      <td><button class="btn-detail" onclick="toggleDetail(this, ${it.norad_id})">${t('btn_detail')}</button></td>
    </tr>
    <tr class="detail-row" id="detail-${it.norad_id}" style="display:none"><td colspan="8"></td></tr>
  `).join('');

  document.getElementById('table-wrap').innerHTML =
    `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

window.sortBy = function (key) {
  if (SORT_KEY === key) SORT_DIR *= -1; else { SORT_KEY = key; SORT_DIR = 1; }
  if (LAST_DATA) renderTable(LAST_DATA);
};

window.toggleDetail = async function (btn, norad) {
  const row = document.getElementById('detail-' + norad);
  const cell = row.querySelector('td');
  if (row.style.display !== 'none') {
    row.style.display = 'none';
    btn.textContent = t('btn_detail');
    return;
  }
  row.style.display = '';
  btn.textContent = t('btn_hide');
  cell.textContent = t('detail_loading');
  try {
    const res = await fetch(`/api/starlink/reentry_detail?norad=${norad}&days=10`);
    const d = await res.json();
    if (d.error) {
      cell.textContent = t('detail_error', { err: d.error });
    } else if (d.reentry_pass) {
      const p = d.reentry_pass;
      cell.innerHTML = `${t('detail_reentered', { t: p.t, lat: p.lat, lon: p.lon, alt: p.alt_km })}<br>
        <span style="color:var(--muted);font-size:11px">${t('detail_method', { m: d.method })}</span>`;
    } else {
      cell.innerHTML = `${t('detail_not_found', { days: 10 })}<br>
        <span style="color:var(--muted);font-size:11px">${t('detail_method', { m: d.method })}</span>`;
    }
  } catch (e) {
    cell.textContent = t('detail_error', { err: e });
  }
};

async function load() {
  try {
    const res = await fetch('/api/starlink/deorbiting?limit=100');
    const data = await res.json();
    renderTable(data);
  } catch (e) {
    document.getElementById('table-wrap').innerHTML = `<div class="err">${e}</div>`;
  }
}

setLang(LANG);
load();
setInterval(load, 5 * 60 * 1000); // 每 5 分鐘自動重新整理（API 端本身也有 5 分鐘快取 header）
</script>
</body>
</html>
