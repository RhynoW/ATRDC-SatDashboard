<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在離軌的 Starlink — SatDashboard</title>
<style>
:root{--bg:#0A0D13;--panel:#12161f;--line:rgba(255,255,255,.09);--ink:#dfe6f0;--muted:#8b96a8;
      --prim:#F2A73B;--sec:#35C6F4;--crit:#FF5C4E;--mono:"Consolas","Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 "Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0}
.top a{color:var(--sec);text-decoration:none;font-family:var(--mono);font-size:12px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
.meta{color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td.num{font-family:var(--mono);text-align:right}
td.neg{color:var(--crit)}
tr.detail-row td{background:rgba(255,255,255,.02);padding:12px 16px}
.btn-detail{background:transparent;border:1px solid var(--line);color:var(--sec);border-radius:6px;
  padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.btn-detail:hover{border-color:var(--sec)}
.loading{color:var(--muted);font-size:13px;padding:20px 0}
.err{color:var(--crit);font-size:12.5px}
.note{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:14px;line-height:1.7}
#lang-switcher{display:inline-flex;gap:4px;margin-left:auto}
.lang-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.lang-btn.active{background:var(--sec);color:#03202b;border-color:var(--sec)}
.seg{font-family:var(--mono);font-size:12px;white-space:nowrap}
.seg small{color:var(--muted);font-size:10.5px}
.badge{display:inline-block;border-radius:9px;padding:0 7px;font-size:10px;font-weight:700;margin-left:4px}
.badge.thrust{background:var(--crit);color:#fff}.badge.far{background:#30404d;color:var(--ink)}
.spark{vertical-align:middle;margin-left:8px}
.refresh-btn{background:var(--prim);color:#1a1205;border:none;border-radius:6px;padding:5px 12px;
  font-family:var(--mono);font-size:11.5px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>⬇ <span data-i18n="page_title">正在離軌的 Starlink</span></h1>
    <a href="/" data-i18n="nav_home">← 地球儀主頁</a>
    <a href="/starlink-census" data-i18n="nav_census">Starlink 顆數普查 →</a>
    <span id="lang-switcher">
      <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
    </span>
  </div>
  <p class="sub" data-i18n="page_sub">即時查詢：近 5 天仍有 TLE、近 30 天半長軸下降逾 40 km、且高度低於 480 km 的 Starlink 衛星（離軌候選）。「預測再入」為分段等效面積校準（Remis 2026）之數值積分預測，背景每 6 小時更新；點「詳細」可即時重算並對照 SGP4 外推。</p>
  <div class="meta" id="meta-line"><span data-i18n="loading">載入中…</span></div>
  <div id="table-wrap"></div>
  <div class="note" id="note-line"></div>
</div>

<script>

const I18N = {

    meta_line: "{total} satellites match, showing top {shown}　·　updated {t}",
    th_name: "Satellite", th_norad: "NORAD", th_launch: "Launch Date", th_alt: "Current Altitude (km)",
    th_da30: "30-day ΔAltitude (km)", th_da7: "7-day ΔAltitude (km)", th_est: "Linear Rough Days", th_detail: "Detail",
    btn_detail: "Detail ▾", btn_hide: "Hide ▴", est_unknown: "—",
    detail_loading: "Computing (segmented effective-area calibration + SGP4 comparison, about 5–15 s)…",
    detail_reentered: "Estimated reentry pass: {t}   ·   Subsatellite point {lat}°, {lon}°   ·   Altitude {alt} km",
    detail_not_found: "No reentry pass found within the {days}-day propagation window (decay may be slower, or beyond the model's reliable range)",
    detail_error: "Computation failed: {err}",
    detail_method: "Method: {m}",
    note_line: "\"Predicted reentry\" calibrates an effective ballistic coefficient over successive TLE pairs, then integrates two-body + J2–J4 + NRLMSISE-00 drag down to 80 km; the window is the wider of the ballistic-coefficient range and ±25% of the remaining hours. Backtested against official TIP messages for 38 natural Starlink reentries in 2026: median error +1.3 h at 24 h before reentry, +0.5 h at 12 h and +0.6 h at 6 h, better than SGP4 extrapolation in every case; satellites that are still thrusting cannot be predicted from TLEs before the burn. \"Linear rough days\" extrapolates the 7-day mean descent rate to 80 km, ignores the exponential growth of drag and therefore overestimates the remaining time; for sorting only. Data: this system's space_db (Space-Track GP) + CelesTrak space weather.",
    th_seg: "Predicted Reentry (UTC)",
    seg_pending: "computing",
    seg_beyond: "not within 10 days",
    seg_thrust: "thrusting?",

    detail_seg: "Segmented calibration reentry: {t} UTC   window {e} – {l} ({h} h after last TLE)",
    detail_seg_beyond: "Segmented calibration: does not reach 80 km within the 10-day integration",
    detail_seg_err: "Segmented calibration failed: {err}",
    detail_thrust: "⚠ The latest segment shows an effective-area jump or a semi-major-axis rise, suggesting thruster firing; this forecast is unreliable (reentry cannot be predicted from TLEs while thrusting).",
    detail_B: "Ballistic coefficient B per segment (red = suspected thrust)",
    detail_sw: "Space weather held at last observed values after {d}",
    detail_sgp4: "Comparison | SGP4 orbit-by-orbit extrapolation:",
    forecast_meta: "   ·   reentry batch {t} UTC ({n} satellites)",
  },
  ja: {
    page_title: "離軌中のStarlink衛星", nav_home: "← 地球儀ホームへ", nav_census: "Starlink機数調査 →",
    page_sub: "リアルタイムクエリ：直近5日以内にTLEがあり、直近30日間で軌道長半径が40km以上低下し、高度が480km未満のStarlink衛星（離軌候補）。「予測再突入」は区間別の等価面積較正（Remis 2026）による数値積分予測で、バックグラウンドで6時間ごとに更新されます。「詳細」で即時再計算し、SGP4外挿と比較できます。",
    loading: "読み込み中…", refresh: "再読み込み",
    meta_line: "該当 {total} 機、上位 {shown} 機を表示　·　更新時刻 {t}",
    th_name: "衛星", th_norad: "NORAD", th_launch: "打ち上げ日", th_alt: "現在高度 (km)",
    th_da30: "30日間 Δ高度 (km)", th_da7: "7日間 Δ高度 (km)", th_est: "線形概算日数", th_detail: "詳細",
    btn_detail: "詳細 ▾", btn_hide: "閉じる ▴", est_unknown: "—",
    detail_loading: "計算中（区間別等価面積較正＋SGP4比較、約5〜15秒）…",
    detail_reentered: "推定再突入周回：{t}　·　直下点 {lat}°, {lon}°　·　高度 {alt} km",
    detail_not_found: "{days}日間の外挿範囲内では再突入周回が見つかりませんでした（減衰が緩やかか、モデルの信頼範囲を超えている可能性があります）",
    detail_error: "計算に失敗しました：{err}",
    detail_method: "方法：{m}",
    note_line: "「予測再突入」は隣接TLEの区間ごとに等価弾道係数を較正し、二体＋J2–J4＋NRLMSISE-00抵抗で高度80kmまで数値積分します。区間は「弾道係数の範囲」と「残り時間の±25%」の広い方です。2026年のStarlink自然再突入38機を公式TIPと照合した検証では、再突入24時間前の誤差中央値+1.3時間、12時間前+0.5時間、6時間前+0.6時間で、すべてSGP4外挿より優れていました。推進中の衛星は噴射前にはどのTLE手法でも予測できません。「線形概算日数」は直近7日の平均降下速度を80kmまで外挿したもので、抵抗の指数的増大を考慮しないため残り時間を過大評価します（並べ替え用）。データ：本システムの space_db（Space-Track GP）＋CelesTrak宇宙天気。",
    th_seg: "予測再突入 (UTC)",
    seg_pending: "計算中",
    seg_beyond: "10日以内に再突入せず",
    seg_thrust: "推進の疑い",
    seg_past: "再突入済みの可能性",
    detail_seg: "区間較正による再突入予測：{t} UTC　区間 {e} ～ {l}（最終TLEから {h} 時間）",
    detail_seg_beyond: "区間較正：10日間の積分範囲内で80kmに達しません",
    detail_seg_err: "区間較正に失敗しました：{err}",
    detail_thrust: "⚠ 直近の区間で等価面積の急増または軌道長半径の上昇があり、推進器の噴射が疑われます。この予測は信頼できません（噴射中はTLEから予測できません）。",
    detail_B: "区間ごとの弾道係数 B（赤点＝推進の疑い）",
    detail_sw: "宇宙天気：{d} 以降は最終観測値で持続と仮定",
    detail_sgp4: "比較｜SGP4による周回外挿：",
    forecast_meta: "　·　再突入予測バッチ {t} UTC（{n} 機）",
  },
};
let LANG = localStorage.getItem('starlink_deorbit_lang') || 'zh';
if (!I18N[LANG]) LANG = 'zh';
function t(key, vars) {
  const d = I18N[LANG] || I18N.zh;
  let s = (key in d) ? d[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', String(vars[k])); });
  return s;
}

let LAST_DATA = null;
let SORT_KEY = 'alt_km', SORT_DIR = 1;

function setLang(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  localStorage.setItem('starlink_deorbit_lang', lang);
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en-US', ja: 'ja-JP' }[lang] || 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  if (LAST_DATA) renderTable(LAST_DATA);
}

function renderTable(data) {
  LAST_DATA = data;
  if (data.error) {
    document.getElementById('table-wrap').innerHTML = `<div class="err">${data.error}</div>`;
    return;
  }
  document.getElementById('meta-line').innerHTML =
    t('meta_line', { total: data.total_matching, shown: data.shown,
      t: (data.generated_at || '').replace('T', ' ').slice(0, 19) + ' UTC' }) +
    (data.forecast && data.forecast.generated_at ? t('forecast_meta', {
      t: data.forecast.generated_at.replace('T', ' ').slice(0, 16), n: data.forecast.n }) : '');
  document.getElementById('note-line').textContent = t('note_line');

  data.items.forEach(it => {
    const sg = it.seg;
    it.seg_t = sg && sg.reentry_utc ? Date.parse(sg.reentry_utc) : Number.POSITIVE_INFINITY;
  });
  const items = [...data.items].sort((a, b) => {
    const x = a[SORT_KEY], y = b[SORT_KEY];
    if (x === y) return 0;
    if (x === Number.POSITIVE_INFINITY) return 1;
    if (y === Number.POSITIVE_INFINITY) return -1;
    return (x - y) * SORT_DIR;
  });
  const cols = [
    ['name', 'th_name'], ['norad_id', 'th_norad'], ['launch_date', 'th_launch'],
    ['alt_km', 'th_alt'], ['da_30d_km', 'th_da30'], ['da_7d_km', 'th_da7'],
    ['seg_t', 'th_seg'], ['est_days_to_reentry_rough', 'th_est'], [null, 'th_detail'],
  ];
  const head = cols.map(([k, label]) =>
    `<th ${k ? `onclick="sortBy('${k}')"` : ''}>${t(label)}${k === SORT_KEY ? (SORT_DIR > 0 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('');

  const rows = items.map(it => `
    <tr>
      <td>${it.name}</td>
      <td class="num">${it.norad_id}</td>
      <td>${it.launch_date || '—'}</td>
      <td class="num">${it.alt_km}</td>
      <td class="num neg">${it.da_30d_km}</td>
      <td class="num neg">${it.da_7d_km}</td>
      <td class="seg">${segCell(it.seg)}</td>
      <td class="num">${it.est_days_to_reentry_rough ?? t('est_unknown')}</td>
      <td><button class="btn-detail" onclick="toggleDetail(this, ${it.norad_id})">${t('btn_detail')}</button></td>
    </tr>
    <tr class="detail-row" id="detail-${it.norad_id}" style="display:none"><td colspan="9"></td></tr>
  `).join('');

  document.getElementById('table-wrap').innerHTML =
    `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

function fmtT(iso) { return iso ? iso.replace('T', ' ').replace('Z', '').slice(0, 16) : '—'; }
function segCell(sg) {
  if (!sg) return `<small>${t('seg_pending')}</small>`;
  if (sg.error) return `<small>—</small>`;
  const badge = sg.latest_segment_flag ? `<span class="badge thrust">${t('seg_thrust')}</span>` : '';
  if (sg.beyond_horizon || !sg.reentry_utc) return `<span class="badge far">${t('seg_beyond')}</span>${badge}`;
  const half = sg.window_early_utc && sg.window_late_utc
    ? Math.round((Date.parse(sg.window_late_utc) - Date.parse(sg.window_early_utc)) / 7.2e6) : null;
  const past = Date.parse(sg.reentry_utc) < Date.now() ? `<span class="badge far">${t('seg_past')}</span>` : '';
  return `${fmtT(sg.reentry_utc)}${half != null ? ` <small>±${half} h</small>` : ''}${badge}${past}`;
}
function sparkB(segs) {
  const pts = (segs || []).filter(s => s.B && s.B > 0);
  if (pts.length < 2) return '';
  const W = 150, H = 34, bs = pts.map(s => s.B), lo = Math.min(...bs), hi = Math.max(...bs), span = (hi - lo) || hi || 1;
  const xy = pts.map((s, i) => [4 + i * (W - 8) / (pts.length - 1), H - 4 - (s.B - lo) / span * (H - 8)]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dots = xy.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${
    (pts[i].flag || pts[i].thrust_flag) ? '#FF5C4E' : '#35C6F4'}"/>`).join('');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="#8b96a8" stroke-width="1.2"/>${dots}</svg>`;
}

window.sortBy = function (key) {
  if (SORT_KEY === key) SORT_DIR *= -1; else { SORT_KEY = key; SORT_DIR = 1; }
  if (LAST_DATA) renderTable(LAST_DATA);
};

window.toggleDetail = async function (btn, norad) {
  const row = document.getElementById('detail-' + norad);
  const cell = row.querySelector('td');
  if (row.style.display !== 'none') {
    row.style.display = 'none';
    btn.textContent = t('btn_detail');
    return;
  }
  row.style.display = '';
  btn.textContent = t('btn_hide');
  cell.textContent = t('detail_loading');
  try {
    const res = await fetch(`/api/starlink/reentry_detail?norad=${norad}&days=10`);
    const d = await res.json();
    if (d.error) {
      cell.textContent = t('detail_error', { err: d.error });
    } else {
      let html = '';
      const sg = d.segmented;
      if (sg && !sg.error) {
        html += sg.reentry_utc
          ? `<b>${t('detail_seg', { t: fmtT(sg.reentry_utc), e: fmtT(sg.window_early_utc), l: fmtT(sg.window_late_utc),
               h: sg.hours_from_last_tle })}</b>`
          : `<b>${t('detail_seg_beyond')}</b>`;
        if (sg.latest_segment_flag) html += `<br><span style="color:var(--crit)">${t('detail_thrust')}</span>`;
        html += `<br><span style="color:var(--muted);font-size:11px">${t('detail_B')}</span>${sparkB(sg.segments)}`;
        if (sg.space_weather && sg.space_weather.persisted_from)
          html += `<br><span style="color:var(--muted);font-size:11px">${t('detail_sw', { d: sg.space_weather.persisted_from })}　·　${sg.force_model || ''}</span>`;
      } else if (sg && sg.error) {
        html += t('detail_seg_err', { err: sg.error });
      }
      html += `<br><span style="color:var(--muted);font-size:11.5px">${t('detail_sgp4')} `;
      if (d.reentry_pass) {
        const p = d.reentry_pass;
        html += t('detail_reentered', { t: p.t, lat: p.lat, lon: p.lon, alt: p.alt_km });
      } else {
        html += t('detail_not_found', { days: 10 });
      }
      html += `</span>`;
      cell.innerHTML = html;
    }
  } catch (e) {
    cell.textContent = t('detail_error', { err: e });
  }
};

async function load() {
  try {
    const res = await fetch('/api/starlink/deorbiting?limit=100');
    const data = await res.json();
    renderTable(data);
  } catch (e) {
    document.getElementById('table-wrap').innerHTML = `<div class="err">${e}</div>`;
  }
}

setLang(LANG);
load();
setInterval(load, 5 * 60 * 1000); // 每 5 分鐘自動重新整理（API 端本身也有 5 分鐘快取 header）
</script>
</body>
</html>
