<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starlink V3 佈署數量統計 — SatDashboard</title>
<style>
:root{--bg:#0A0D13;--panel:#12161f;--line:rgba(255,255,255,.09);--ink:#dfe6f0;--muted:#8b96a8;
      --prim:#F2A73B;--sec:#35C6F4;--warn:#e3b341;--mono:"Consolas","Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 "Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0}
.top a{color:var(--sec);text-decoration:none;font-family:var(--mono);font-size:12px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.card h2{font-size:16px;margin:0 0 10px}
.stat-big{text-align:center;padding:20px 0}
.stat-big .n{font-size:52px;font-weight:700;font-family:var(--mono);color:var(--prim)}
.stat-big .l{color:var(--muted);font-size:13px;margin-top:6px}
.warn-box{background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.3);border-radius:9px;
  padding:12px 14px;margin:10px 0;font-size:12.5px}
.warn-box b{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
td.num{font-family:var(--mono);text-align:right}
.note{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:10px;line-height:1.7}
.err{color:var(--crit);font-size:12.5px}
.loading{color:var(--muted);font-size:13px;padding:20px 0}
#lang-switcher{display:inline-flex;gap:4px;margin-left:auto}
.lang-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:3px 9px;font-family:var(--mono);font-size:11px;cursor:pointer}
.lang-btn.active{background:var(--sec);color:#03202b;border-color:var(--sec)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🚀 <span data-i18n="page_title">Starlink V3 佈署數量統計</span></h1>
    <a href="/" data-i18n="nav_home">← 地球儀主頁</a>
    <a href="/starlink-census" data-i18n="nav_census">Starlink 顆數普查 →</a>
    <span id="lang-switcher">
      <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
    </span>
  </div>
  <p class="sub" data-i18n="page_sub">追蹤疑似 Starlink V3（新一代營運衛星）的部署數量。目錄本身不含硬體世代標記，本頁以「公開已知部署時程＋初始入軌殼層」的啟發式間接推測，並非官方分類。</p>

  <div class="card">
    <div class="stat-big"><div class="n" id="count-n">—</div><div class="l" data-i18n="stat_label">目前偵測到的疑似 V3 衛星數</div></div>
    <div id="meta-line" class="note"></div>
  </div>

  <div class="card">
    <h2 data-i18n="schedule_title">已知部署時程（公開資訊，非本系統可獨立驗證）</h2>
    <div class="warn-box" id="schedule-box"><span class="loading" data-i18n="loading">載入中…</span></div>
  </div>

  <div class="card" id="list-card" style="display:none">
    <h2 data-i18n="list_title">已偵測到的疑似 V3 衛星清單</h2>
    <div id="list-body"></div>
  </div>

  <div class="card">
    <h2 data-i18n="method_title">判定方法與限制</h2>
    <div id="method-body"></div>
  </div>
</div>

<script>
"use strict";
const I18N = {
  zh: {
    page_title: "Starlink V3 佈署數量統計", nav_home: "← 地球儀主頁", nav_census: "Starlink 顆數普查 →",
    page_sub: "追蹤疑似 Starlink V3（新一代營運衛星）的部署數量。目錄本身不含硬體世代標記，本頁以「公開已知部署時程＋初始入軌殼層」的啟發式間接推測，並非官方分類。",
    stat_label: "目前偵測到的疑似 V3 衛星數", loading: "載入中…",
    schedule_title: "已知部署時程（公開資訊，非本系統可獨立驗證）",
    list_title: "已偵測到的疑似 V3 衛星清單", method_title: "判定方法與限制",
    meta_zero: "目前尚未偵測到符合條件的衛星（部署時程若尚未到來，這是預期中的結果，並非系統錯誤）。",
    meta_found: "自 {era} 起、初始入軌高度落在已知規劃殼層者，本系統資料庫最新 TLE 時刻：{t}",
    th_name: "衛星", th_norad: "NORAD", th_first: "首次見於", th_alt: "初始高度 (km)",
    method_p1: "由於 Space-Track／CelesTrak 的公開目錄不會標記衛星的硬體世代（v1.0／v1.5／v2 Mini／V3），本頁只能用兩個間接線索去猜：（1）該衛星在本系統資料庫中最早出現的 TLE 時刻是否已到公開報導的 V3 部署時程之後；（2）該筆最早 TLE 的高度是否落在已知規劃的初始部署殼層內（±5 km 容許）。",
    method_p2: "這是不精確的代理指標：無法排除同一時期剛好也在類似高度部署的其他世代衛星，也可能因早期軌道尚未穩定而誤判。隨著更可靠的公開資料（例如官方確認的發射批次 COSPAR ID 清單）出現，應該用那些取代這裡的高度啟發式。",
    method_p3: "本頁為即時查詢，不需要手動更新——一旦本系統的每日 TLE 管線抓到符合條件的新衛星，數字會自動反映。",
  },
  en: {
    page_title: "Starlink V3 Deployment Count", nav_home: "← Globe Home", nav_census: "Starlink Count Audit →",
    page_sub: "Tracks the number of suspected Starlink V3 (next-generation operational) satellites deployed. Public catalogs carry no hardware-generation tag, so this page uses a heuristic — publicly known deployment schedule plus initial orbital insertion shell — as an indirect proxy; it is not an official classification.",
    stat_label: "Suspected V3 satellites currently detected", loading: "Loading…",
    schedule_title: "Known Deployment Schedule (public information, not independently verified by this system)",
    list_title: "Detected Suspected V3 Satellites", method_title: "Method and Limitations",
    meta_zero: "No matching satellites detected yet (if the deployment schedule hasn't arrived yet, this is the expected result, not a system error).",
    meta_found: "Satellites first seen on or after {era} with an initial insertion altitude in the known planned shells; this system's latest TLE timestamp: {t}",
    th_name: "Satellite", th_norad: "NORAD", th_first: "First Seen", th_alt: "Initial Altitude (km)",
    method_p1: "Because public Space-Track/CelesTrak catalogs do not tag a satellite's hardware generation (v1.0 / v1.5 / v2 Mini / V3), this page can only guess using two indirect clues: (1) whether the satellite's earliest TLE epoch in this system's database is on or after the publicly reported V3 deployment schedule; (2) whether that earliest TLE's altitude falls within the known planned initial deployment shells (±5 km tolerance).",
    method_p2: "This is an imprecise proxy: it cannot rule out other-generation satellites happening to deploy into a similar altitude during the same period, and early, not-yet-stabilized orbits could also cause misclassification. As more reliable public data becomes available (e.g., an officially confirmed launch-batch COSPAR ID list), that should replace this altitude-based heuristic.",
    method_p3: "This page is a live query and needs no manual update — once this system's daily TLE pipeline picks up a new satellite matching the criteria, the count reflects it automatically.",
  },
  ja: {
    page_title: "Starlink V3 展開機数統計", nav_home: "← 地球儀ホームへ", nav_census: "Starlink機数調査 →",
    page_sub: "疑わしいStarlink V3（新世代運用衛星）の展開機数を追跡します。公開カタログ自体にはハードウェア世代のタグが含まれないため、本ページは「公開されている既知の展開スケジュール＋初期投入軌道殻層」というヒューリスティックによる間接推定であり、公式な分類ではありません。",
    stat_label: "現在検出されている疑わしいV3衛星数", loading: "読み込み中…",
    schedule_title: "既知の展開スケジュール（公開情報、本システムでは独自検証不可）",
    list_title: "検出された疑わしいV3衛星一覧", method_title: "判定方法と限界",
    meta_zero: "現時点で条件に合致する衛星は検出されていません（展開スケジュールがまだ到来していない場合、これは想定内の結果であり、システムエラーではありません）。",
    meta_found: "{era} 以降に初めて検出され、初期投入高度が既知の計画殻層内にある衛星。本システムの最新TLE時刻：{t}",
    th_name: "衛星", th_norad: "NORAD", th_first: "初検出", th_alt: "初期高度 (km)",
    method_p1: "Space-Track／CelesTrakの公開カタログには衛星のハードウェア世代（v1.0／v1.5／v2 Mini／V3）を示すタグが存在しないため、本ページは2つの間接的な手がかりのみで推測しています：（1）本システムのデータベースにおける当該衛星の最も早いTLEエポックが、公開報道されているV3展開スケジュール以降であるか、（2）その最も早いTLEの高度が、既知の計画上の初期展開殻層内（±5 km許容）にあるか。",
    method_p2: "これは不正確な代理指標です。同時期に類似高度へ展開された他世代の衛星を排除できず、初期の軌道がまだ安定していないことによる誤判定の可能性もあります。より信頼性の高い公開データ（例：公式に確認された打ち上げバッチのCOSPAR IDリスト）が入手可能になり次第、この高度ヒューリスティックを置き換えるべきです。",
    method_p3: "本ページはリアルタイムクエリのため、手動更新は不要です——本システムの日次TLEパイプラインが条件に合致する新しい衛星を検知次第、数値は自動的に反映されます。",
  },
};
let LANG = localStorage.getItem('starlink_v3_lang') || 'zh';
if (!I18N[LANG]) LANG = 'zh';
function t(key, vars) {
  const d = I18N[LANG] || I18N.zh;
  let s = (key in d) ? d[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', String(vars[k])); });
  return s;
}
let LAST_DATA = null;

function setLang(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  localStorage.setItem('starlink_v3_lang', lang);
  document.documentElement.lang = { zh: 'zh-Hant', en: 'en-US', ja: 'ja-JP' }[lang] || 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  if (LAST_DATA) render(LAST_DATA);
}

function render(data) {
  LAST_DATA = data;
  if (data.error) {
    document.getElementById('count-n').textContent = '—';
    document.getElementById('meta-line').innerHTML = `<span class="err">${data.error}</span>`;
    return;
  }
  document.getElementById('count-n').textContent = data.candidate_count;
  document.getElementById('meta-line').textContent = data.candidate_count === 0
    ? t('meta_zero')
    : t('meta_found', { era: data.era_start, t: (data.db_latest_epoch || '').replace('T', ' ').slice(0, 19) + ' UTC' });

  document.getElementById('schedule-box').innerHTML =
    `<b>${data.era_start}</b> — ${data.known_schedule_note}`;

  if (data.items && data.items.length) {
    document.getElementById('list-card').style.display = '';
    const rows = data.items.map(it => `
      <tr><td>${it.name}</td><td class="num">${it.norad_id}</td>
      <td>${(it.first_epoch || '').replace('T', ' ').slice(0, 16)}</td>
      <td class="num">${it.alt_km}</td></tr>`).join('');
    document.getElementById('list-body').innerHTML = `
      <table><thead><tr><th>${t('th_name')}</th><th>${t('th_norad')}</th><th>${t('th_first')}</th><th>${t('th_alt')}</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  } else {
    document.getElementById('list-card').style.display = 'none';
  }

  document.getElementById('method-body').innerHTML =
    `<p>${t('method_p1')}</p><p>${t('method_p2')}</p><p>${t('method_p3')}</p>`;
}

async function load() {
  try {
    const res = await fetch('/api/starlink/v3_census');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('meta-line').innerHTML = `<span class="err">${e}</span>`;
  }
}

setLang(LANG);
load();
</script>
</body>
</html>
