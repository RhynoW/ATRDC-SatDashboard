<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<title>台北覆蓋分析 — Cesium 2D</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/taipei.css') }}"/>
<script>/* HF 代理暫時性 502/503/504：同源 GET fetch 自動重試 3 次（0.8/1.6/2.4 s） */(function(){var f=window.fetch;if(!f)return;window.fetch=function(input,init){var m=((init&&init.method)||(input&&input.method)||'GET').toUpperCase();var u=typeof input==='string'?input:(input&&input.url)||'';var same=u.charAt(0)==='/'||u.indexOf(location.origin)===0;if(m!=='GET'||!same)return f.apply(this,arguments);var self=this,args=arguments;return new Promise(function(res,rej){(function go(n){f.apply(self,args).then(function(r){if((r.status===502||r.status===503||r.status===504)&&n<3){setTimeout(function(){go(n+1);},800*(n+1));}else{res(r);}},function(e){if(n<3){setTimeout(function(){go(n+1);},800*(n+1));}else{rej(e);}});})(0);});};}());</script>
<script>window.CESIUM_ION_TOKEN="{{ cesium_token }}";</script>
<script>
window._cesiumRetry=function(){try{var R=Cesium.Resource,o=R.prototype.retryOnError;R.prototype.retryOnError=function(e){var s=e&&e.statusCode,n=this._retryCount||0;if((s===502||s===503||s===504)&&n<3){this._retryCount=n+1;return new Promise(function(r){setTimeout(function(){r(true);},800*(n+1));});}return o.call(this,e);};}catch(err){}};  /* Cesium 素材（JSON/貼圖/GeoJSON）遇 HF 代理 502/503/504 重試 3 次 */
(function(){
  function _css(h){var l=document.createElement('link');l.rel='stylesheet';l.href=h;document.head.appendChild(l);}
  function _js(src,ok,fail,n){n=n||0;var s=document.createElement('script');s.src=n?src+(src.indexOf('?')<0?'?':'&')+'retry='+n:src;s.onload=ok;s.onerror=function(){s.remove();if(n<3){setTimeout(function(){_js(src,ok,fail,n+1);},1500*(n+1));}else{(fail||function(){})();}};document.head.appendChild(s);}  /* 失敗自動重試 3 次（1.5/3/4.5 s），吸收 HF 代理暫時性 502/503 */
  function _err(m){var el=document.getElementById('map-loading');if(el){el.textContent=m;el.style.color='#f44336';}}
  var _mapStarted=false;
  // 地圖（Cesium）改為首次切到「地圖」檢視時才載入；天球檢視完全不需 Cesium
  window.loadMapOnce=function(){
    if(_mapStarted||typeof startApp!=='function') return;
    _mapStarted=true;
    _css('/cesium/Widgets/widgets.css');
    _js('/cesium/Cesium.js',function(){window._cesiumRetry();startApp();},function(){_err('本機 Cesium 未安裝，請將 CesiumJS 解壓至 data/cesium/');});
  };
  var SKY_LIBS=[
    "{{ url_for('static', filename='vendor/astronomy/astronomy.browser.min.js') }}",
    "{{ url_for('static', filename='js/sky_catalog.js') }}",
    "{{ url_for('static', filename='js/taipei_gif.js') }}",
    "{{ url_for('static', filename='js/taipei_sky.js') }}"
  ];
  function _chain(i){
    if(i>=SKY_LIBS.length){ if(window.TaipeiSky) window.TaipeiSky.init(); return; }
    _js(SKY_LIBS[i],function(){_chain(i+1);},function(){var m=document.getElementById('sky-view');if(m)m.textContent='前端腳本載入失敗: '+SKY_LIBS[i];});
  }
  _js("{{ url_for('static', filename='js/taipei.js') }}",function(){_chain(0);},function(){_err('前端腳本 taipei.js 載入失敗');});
}());
</script>
</head>
<body>
<div id="topbar">
  <h1>&#127988; <span data-i18n="header_title">台北覆蓋分析 &#8212; 2000 km 範圍衛星過頂</span></h1>
  <div id="clock">&#8212;</div>
  <div id="lang-switcher">
    <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
    <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
  </div>
  <div id="view-switcher">
    <button type="button" class="view-btn active" data-view="sky" onclick="TaipeiSky.setView('sky')">&#127756; <span data-i18n="view_sky">天球</span></button>
    <button type="button" class="view-btn" data-view="map" onclick="TaipeiSky.setView('map')">&#128506; <span data-i18n="view_map">地圖</span></button>
  </div>
  <button class="tbtn map-only" onclick="refreshAll()">&#8635; <span data-i18n="btn_refresh">更新</span></button>
  <a class="tbtn" href="/starlink">&#127921; Starlink</a>
  <a class="tbtn" href="/story">&#128214; StoryMap</a>
  <a class="tbtn" href="/">&#8592; <span data-i18n="nav_home">返回主頁</span></a>
</div>
<div id="main">
  <div id="sky-view"></div>
  <div id="panel">
    <div id="panel-header">
      <h2 data-i18n="panel_title">衛星分類覆蓋</h2>
      <div class="sub" data-i18n="panel_sub">台北 25.03&#176;N 121.57&#176;E &nbsp;&#183;&nbsp; 仰角遮蔽 5&#176;</div>
    </div>
    <div id="tab-bar">
      <button class="ptab active" data-tab="overview" onclick="switchPanelTab('overview')" data-i18n="tab_overview">分類概況</button>
      <button class="ptab" data-tab="passes" onclick="switchPanelTab('passes')" data-i18n="tab_passes">過頂預報</button>
    </div>
    <div id="step-control" style="display:none;align-items:center;gap:6px;
         padding:4px 10px;border-bottom:1px solid #21262d;font-size:11px;">
      <span style="color:#8b949e;white-space:nowrap;" data-i18n="step_label_prefix">時間步長：</span>
      <input type="range" id="step-slider" min="1" max="60" step="1" value="15"
             style="flex:1;accent-color:#4af;" oninput="updateStepLabel(this.value)">
      <span id="step-label" style="color:#4af;width:38px;text-align:right;white-space:nowrap;">15 分</span>
      <button onclick="applyStepChange()"
              style="padding:2px 8px;background:#1a3a5c;color:#4af;
                     border:1px solid #4af;border-radius:3px;font-size:10px;cursor:pointer;" data-i18n="btn_apply_step">套用</button>
    </div>
    <div id="panel-body"><div class="pass-empty" data-i18n="panel_loading">載入中...</div></div>
  </div>
  <div id="map-wrap">
    <div id="cesiumContainer"></div>
    <div id="map-loading" data-i18n="map_loading">初始化地圖...</div>
    <div id="legend">
      <h4 data-i18n="legend_title">衛星分類</h4>
      <div class="leg-row" data-cat="US_EO" onclick="toggleCatFilter('US_EO')">
        <div class="leg-dot" style="background:#4488FF"></div>
        <span class="leg-label" data-i18n="cat_us_eo_label">美國商用光學</span>
      </div>
      <div class="leg-row" data-cat="CN_COMM" onclick="toggleCatFilter('CN_COMM')">
        <div class="leg-dot" style="background:#FF9800"></div>
        <span class="leg-label" data-i18n="cat_cn_comm_label">中國商用光學</span>
      </div>
      <div class="leg-row" data-cat="CN_MIL" onclick="toggleCatFilter('CN_MIL')">
        <div class="leg-dot" style="background:#F44336"></div>
        <span class="leg-label" data-i18n="cat_cn_mil_label">中國軍用偵察</span>
      </div>
      <div class="leg-row" data-cat="TW_TASA" onclick="toggleCatFilter('TW_TASA')">
        <div class="leg-dot" style="background:#00E5FF"></div>
        <span class="leg-label" data-i18n="cat_tw_tasa_label">台灣 TASA</span>
      </div>
      <div class="leg-row" data-cat="STARLINK" onclick="toggleCatFilter('STARLINK')">
        <div class="leg-dot" style="background:#A855F7"></div>
        <span class="leg-label" data-i18n="cat_starlink_label">Starlink 星鏈</span>
      </div>
      <div style="border-top:1px solid #21262d;margin-top:5px;padding-top:5px;
                  display:flex;align-items:center;gap:7px">
        <div style="width:14px;height:3px;background:#FFD600;border-radius:1px;flex-shrink:0"></div>
        <span style="font-size:10px;color:#8b949e" data-i18n="legend_circle_note">2000 km 覆蓋圈</span>
      </div>
    </div>
    <!-- Timeline bar -->
    <div id="timeline">
      <input type="range" id="tl-slider" min="-43200" max="43200" step="15" value="0"
             oninput="tlSliderInput(this.value)" onchange="tlSliderChange(this.value)"/>
      <div id="tl-row">
        <span id="tl-bounds" class="tl-lb" data-i18n="tl_bounds_past">&#8722;30天</span>
        <span id="tl-time">&#8212;</span>
        <span id="tl-bounds" class="tl-rb" data-i18n="tl_bounds_future">&#43;30天</span>
        <button class="tl-now-btn" onclick="jumpToNow()">&#9654; <span data-i18n="tl_now_btn">現在</span></button>
        <span id="tl-badge" class="tl-badge now" data-i18n="tl_badge_now">現在</span>
        <span id="tl-loading"></span>
      </div>
    </div>
    <div id="statusbar">
      <div class="sitem"><span data-i18n="status_total">衛星</span> <span id="st-total">&#8212;</span></div>
      <div class="sitem"><span data-i18n="status_visible">可見</span> <span id="st-visible">&#8212;</span></div>
      <div class="sitem"><span data-i18n="status_plotted">圖上</span> <span id="st-plotted">&#8212;</span></div>
      <div class="sitem"><span data-i18n="status_time">時刻</span> <span id="st-time">&#8212;</span></div>
    </div>
  </div>
</div>
</body>
</html>
