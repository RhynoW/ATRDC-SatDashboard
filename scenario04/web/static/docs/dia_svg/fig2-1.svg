<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 920 470" font-family="'Noto Sans CJK TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif" width="920" height="470"><title>圖 2-1　反太空威脅連續體</title><desc>來源：DIA，《Challenges to Security in Space 2026》，原書第 6 頁；本版依原圖以中文重繪。</desc><rect width="920" height="470" fill="#ffffff"/><defs><linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#cfe9dc"/><stop offset=".5" stop-color="#f6e3b4"/><stop offset="1" stop-color="#f2b8b3"/></linearGradient></defs><path d="M40,190 L800,190 L800,160 L890,230 L800,300 L800,270 L40,270 z" fill="url(#gc)"/><text x="60" y="237" font-size="20" fill="#1f6a46" text-anchor="start" font-weight="700" >可逆</text><text x="780" y="237" font-size="20" fill="#9b2c2c" text-anchor="end" font-weight="700" >不可逆</text><text x="450" y="237" font-size="17" fill="#7a5b12" text-anchor="middle" font-weight="700" >暫時或永久</text><rect x="45" y="40" width="240" height="44" rx="22" fill="#fff" stroke="#2a9d6b" stroke-width="2"/><circle cx="67" cy="62" r="11" fill="#2a9d6b"/><text x="89" y="60" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >太空情勢感知</text><text x="89" y="77" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >支援標定與評估</text><rect x="45" y="100" width="240" height="44" rx="22" fill="#fff" stroke="#2a9d6b" stroke-width="2"/><circle cx="67" cy="122" r="11" fill="#2a9d6b"/><text x="89" y="120" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >拒止與欺騙</text><text x="89" y="137" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >非破壞、暫時性</text><rect x="45" y="330" width="240" height="44" rx="22" fill="#fff" stroke="#2a9d6b" stroke-width="2"/><circle cx="67" cy="352" r="11" fill="#2a9d6b"/><text x="89" y="350" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >電子攻擊</text><text x="89" y="367" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >干擾與欺騙</text><line x1="165" y1="144" x2="165" y2="190" stroke="#2a9d6b" stroke-width="2" stroke-dasharray="4 3"/><line x1="165" y1="270" x2="165" y2="330" stroke="#2a9d6b" stroke-width="2" stroke-dasharray="4 3"/><rect x="335" y="40" width="240" height="44" rx="22" fill="#fff" stroke="#c79a2c" stroke-width="2"/><circle cx="357" cy="62" r="11" fill="#c79a2c"/><text x="379" y="60" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >定向能武器</text><text x="379" y="77" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >致眩、致盲或損壞</text><rect x="335" y="100" width="240" height="44" rx="22" fill="#fff" stroke="#c79a2c" stroke-width="2"/><circle cx="357" cy="122" r="11" fill="#c79a2c"/><text x="379" y="120" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >網路攻擊</text><text x="379" y="137" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >可逆至不可逆</text><rect x="335" y="330" width="240" height="44" rx="22" fill="#fff" stroke="#c79a2c" stroke-width="2"/><circle cx="357" cy="352" r="11" fill="#c79a2c"/><text x="379" y="350" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >軌道威脅</text><text x="379" y="367" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >在軌武器與機動</text><line x1="455" y1="144" x2="455" y2="190" stroke="#c79a2c" stroke-width="2" stroke-dasharray="4 3"/><line x1="455" y1="270" x2="455" y2="330" stroke="#c79a2c" stroke-width="2" stroke-dasharray="4 3"/><rect x="625" y="40" width="240" height="44" rx="22" fill="#fff" stroke="#c0504d" stroke-width="2"/><circle cx="647" cy="62" r="11" fill="#c0504d"/><text x="669" y="60" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >動能武器</text><text x="669" y="77" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >直接摧毀衛星</text><rect x="625" y="100" width="240" height="44" rx="22" fill="#fff" stroke="#c0504d" stroke-width="2"/><circle cx="647" cy="122" r="11" fill="#c0504d"/><text x="669" y="120" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >地面站攻擊</text><text x="669" y="137" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >實體破壞基礎設施</text><rect x="625" y="330" width="240" height="44" rx="22" fill="#fff" stroke="#c0504d" stroke-width="2"/><circle cx="647" cy="352" r="11" fill="#c0504d"/><text x="669" y="350" font-size="16" fill="#1d2321" text-anchor="start" font-weight="700" >太空核爆</text><text x="669" y="367" font-size="12" fill="#5d6964" text-anchor="start" font-weight="400" >大範圍永久性損害</text><line x1="745" y1="144" x2="745" y2="190" stroke="#c0504d" stroke-width="2" stroke-dasharray="4 3"/><line x1="745" y1="270" x2="745" y2="330" stroke="#c0504d" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="410" font-size="13" fill="#4b5753" text-anchor="start" font-weight="400" >可逆效果：拒止與欺騙、電子戰屬非破壞性且暫時性，事件後系統可恢復正常運作。</text><text x="40" y="432" font-size="13" fill="#4b5753" text-anchor="start" font-weight="400" >暫時或永久：定向能武器、網路威脅與軌道威脅。</text><text x="40" y="454" font-size="13" fill="#4b5753" text-anchor="start" font-weight="400" >永久效果：動能攻擊、對太空相關地面基礎設施的實體攻擊，以及太空核爆。</text></svg>