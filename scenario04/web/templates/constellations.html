<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>星座排行 — 僅有效載荷</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',Tahoma,'Microsoft JhengHei',sans-serif;min-height:100vh}
#hdr{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#161b22;border-bottom:1px solid #21262d;flex-wrap:wrap}
#hdr h1{font-size:17px;color:#e6edf3;font-weight:600}
#hdr .sub{font-size:12px;color:#8b949e}
#hdr .sp{flex:1}
#hdr a{color:#58a6ff;font-size:12.5px;text-decoration:none;border:1px solid #30363d;border-radius:5px;padding:5px 11px;background:#21262d}
#hdr a:hover{background:#30363d}
#lang-switcher{display:flex;gap:4px}
.lang-btn{padding:4px 8px;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:4px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .15s}
.lang-btn:hover{background:#30363d;color:#c9d1d9}
.lang-btn.active{background:#A855F7;color:#fff;border-color:#A855F7}
#meta{padding:10px 22px 0;font-size:12px;color:#8b949e;display:flex;gap:18px;flex-wrap:wrap}
#meta b{color:#e6edf3}
#ctrl{padding:10px 22px;display:flex;gap:16px;align-items:center;font-size:12.5px;color:#8b949e;flex-wrap:wrap}
#ctrl select{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:3px 8px;font-size:12.5px}
#ctrl label{display:flex;gap:5px;align-items:center;cursor:pointer}
#list{padding:6px 22px 30px;max-width:980px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #161b22}
.rk{width:26px;text-align:right;font-size:11.5px;color:#484f58}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.lb{width:225px;font-size:13.5px;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barwrap{flex:1;height:14px;background:#161b22;border-radius:7px;overflow:hidden;display:block}
.bar{display:block;height:100%;border-radius:7px;min-width:3px;transition:width .4s}
.ct{width:76px;text-align:right;font-size:13.5px;font-weight:600;color:#e6edf3}
#empty{padding:30px 22px;color:#8b949e}
@media(max-width:640px){.lb{width:130px;font-size:12px}.ct{width:60px;font-size:12px}}
</style>
</head>
<body>
<div id="hdr">
  <h1>&#127756; <span data-i18n="app_title">星座排行</span></h1>
  <span class="sub" data-i18n="app_subtitle">僅有效載荷（不含碎片／火箭體）</span>
  <span class="sp"></span>
  <div id="lang-switcher">
    <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</button>
    <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
  </div>
  <a href="/api/stats/constellations" target="_blank">JSON API</a>
  <a href="/">&#8592; <span data-i18n="nav_home">返回主頁</span></a>
</div>
<div id="meta">
  <span><span data-i18n="lbl_total">有效載荷總數</span> <b id="m-total">—</b></span>
  <span><span data-i18n="lbl_count">星座數</span> <b id="m-n">—</b></span>
  <span><span data-i18n="lbl_time">統計時間</span> <b id="m-time">—</b></span>
</div>
<div id="ctrl">
  <label><span data-i18n="lbl_top_prefix">顯示前</span>
    <select id="sel-top">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="30">30</option>
      <option value="0" data-i18n="opt_all">全部</option>
    </select> <span data-i18n="lbl_top_suffix">名</span>
  </label>
  <label><input type="checkbox" id="chk-other" checked/> <span data-i18n="lbl_hide_other">隱藏「其他衛星」</span></label>
  <label><span data-i18n="lbl_bar_scale">長條比例</span>
    <select id="sel-scale">
      <option value="linear" selected data-i18n="opt_linear">線性</option>
      <option value="sqrt" data-i18n="opt_sqrt">平方根（易讀小星座）</option>
    </select>
  </label>
</div>
<div id="list"><div id="empty" data-i18n="loading_msg">載入中...</div></div>
<script>
'use strict';

// ── 三語字典（中／英／日）─────────────────────────────────────────────────────
const I18N = {
  zh: {
    doc_title: '星座排行 — 僅有效載荷',
    app_title: '星座排行',
    app_subtitle: '僅有效載荷（不含碎片／火箭體）',
    nav_home: '返回主頁',
    lbl_total: '有效載荷總數',
    lbl_count: '星座數',
    lbl_time: '統計時間',
    lbl_top_prefix: '顯示前',
    lbl_top_suffix: '名',
    opt_all: '全部',
    lbl_hide_other: '隱藏「其他衛星」',
    lbl_bar_scale: '長條比例',
    opt_linear: '線性',
    opt_sqrt: '平方根（易讀小星座）',
    loading_msg: '載入中...',
    error_msg: '載入失敗，請重新整理',
  },
  ja: {
    doc_title: 'コンステレーションランキング — ペイロードのみ',
    app_title: 'コンステレーションランキング',
    app_subtitle: 'ペイロードのみ（デブリ・ロケット本体を含まず）',
    nav_home: 'ホームに戻る',
    lbl_total: 'ペイロード総数',
    lbl_count: 'コンステレーション数',
    lbl_time: '統計時刻',
    lbl_top_prefix: '表示件数：上位',
    lbl_top_suffix: '件',
    opt_all: 'すべて',
    lbl_hide_other: '「その他の衛星」を非表示',
    lbl_bar_scale: 'バーのスケール',
    opt_linear: '線形',
    opt_sqrt: '平方根スケール（小規模のコンステレーションを見やすく表示）',
    loading_msg: '読み込み中...',
    error_msg: '読み込みに失敗しました。再読み込みしてください',
  },
  en: {
    doc_title: 'Constellation Ranking — Payloads Only',
    app_title: 'Constellation Ranking',
    app_subtitle: 'Payloads Only (Excludes Debris and Rocket Bodies)',
    nav_home: 'Back to Home',
    lbl_total: 'Total Payloads',
    lbl_count: 'Constellations',
    lbl_time: 'Statistics Time',
    lbl_top_prefix: 'Show Top',
    lbl_top_suffix: 'entries',
    opt_all: 'All',
    lbl_hide_other: 'Hide "Other Satellites"',
    lbl_bar_scale: 'Bar Scaling',
    opt_linear: 'Linear',
    opt_sqrt: 'Square-Root Scale (Improves Visibility of Smaller Constellations)',
    loading_msg: 'Loading...',
    error_msg: 'Failed to load. Please refresh.',
  },
};
const LOCALE_MAP = {zh:'zh-Hant', en:'en-US', ja:'ja-JP'};
let LANG = localStorage.getItem('constellations_lang') || 'zh';
if(!I18N[LANG]) LANG = 'zh';

function t(key){
  const d = I18N[LANG] || I18N.zh;
  return (key in d) ? d[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
}
function tpl(key, vars){
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]); });
  return s;
}
function setLang(lang){
  if(!I18N[lang]) return;
  LANG = lang;
  localStorage.setItem('constellations_lang', lang);
  document.documentElement.lang = LOCALE_MAP[lang] || 'zh-Hant';
  document.title = t('doc_title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(b => { b.classList.toggle('active', b.dataset.lang === lang); });
  if(DATA) render();
}

let DATA=null;
function fmt(n){return n.toLocaleString(LOCALE_MAP[LANG] || 'zh-Hant');}
function render(){
  const list=document.getElementById('list');
  if(!DATA){list.innerHTML="<div id='empty'>"+t('error_msg')+"</div>";return;}
  const hideOther=document.getElementById('chk-other').checked;
  const top=parseInt(document.getElementById('sel-top').value);
  const scale=document.getElementById('sel-scale').value;
  let rows=DATA.constellation.filter(r=>!(hideOther&&r.label==='其他衛星'));
  if(top>0) rows=rows.slice(0,top);
  const mx=Math.max(...rows.map(r=>r.count),1);
  const w=c=>scale==='sqrt'?Math.sqrt(c)/Math.sqrt(mx)*100:c/mx*100;
  list.innerHTML='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='row';
    d.innerHTML=
      "<span class='rk'>"+String(i+1).padStart(2,'0')+"</span>"
      +"<span class='dot' style='background:"+r.color+"'></span>"
      +"<span class='lb' title='"+r.label+"'>"+r.label+"</span>"
      +"<span class='barwrap'><span class='bar' style='width:"+w(r.count).toFixed(2)+"%;background:"+r.color+"'></span></span>"
      +"<span class='ct'>"+fmt(r.count)+"</span>";
    list.appendChild(d);
  });
  document.getElementById('m-n').textContent=DATA.constellation.length;
}
async function load(){
  try{
    const r=await fetch('/api/stats/constellations');
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    document.getElementById('m-total').textContent=fmt(DATA.payload_total);
    const updTime=new Date(DATA.updated_at);
    document.getElementById('m-time').textContent=
      new Date(updTime.getTime()+8*3600*1000).toISOString().replace('T',' ').slice(0,19)+' CST';
  }catch(e){console.error(e);DATA=null;}
  render();
}
['sel-top','chk-other','sel-scale'].forEach(id=>
  document.getElementById(id).addEventListener('change',render));
setLang(LANG);
load();
</script>
</body>
</html>
